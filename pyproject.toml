[project]
name = "ml-challenge-2025"
version = "1.0.0"
description = "ML Challenge 2025 - GPU-Optimized Multimodal Fusion by Team Monk Builders"
authors = [
    { name = "Suraj Kumar" },
    { name = "Himanshu Rai" },
    { name = "Pratik Gautam" },
    { name = "Impana KS" },
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "scipy>=1.10.0",
    "joblib>=1.3.0",
    "cupy-cuda12x>=12.0.0",
    "psutil>=5.9.0",
    "sentence-transformers>=2.2.0",
    "tqdm>=4.64.0",
    "transformers>=4.21.0",
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "pytest>=7.0.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]
gpu = [
    "nvidia-ml-py>=12.535.0",
    "pynvml>=11.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
